<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>RDM update</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="dialog fit">
    <div id="question" class="headline"></div>
    <div id="current" class="muted"></div>
    <div id="notes" class="notes" hidden></div>
    <div id="running" class="hint" hidden></div>
    <div id="progress" class="muted" hidden></div>
    <div id="error" class="error"></div>
    <div class="buttons">
      <span class="grow"></span>
      <button id="now" class="default">Update now</button>
      <button id="cancel">Later</button>
    </div>
    <script src="common.js"></script>
    <script src="update.js"></script>
  </body>
</html>
