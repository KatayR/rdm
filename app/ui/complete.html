<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Download complete</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="dialog fit">
    <div class="headline">Download complete</div>
    <table class="kv">
      <tr><th>Downloaded</th><td id="size"></td></tr>
      <tr><th>Address</th><td id="url"></td></tr>
      <tr><th>The file saved as</th><td id="path"></td></tr>
      <tr id="checkedrow" hidden><th>Checked</th><td id="checked"></td></tr>
      <tr id="filerow" hidden><th>File check</th><td id="filecheck" class="wrap"></td></tr>
      <tr>
        <th class="middle"><label for="sum">Checksum</label></th>
        <td>
          <div class="field-button">
            <input id="sum" spellcheck="false" placeholder="MD5, SHA-1, SHA-256 or SHA-512 from the site" />
            <button id="check" class="small">Check</button>
          </div>
        </td>
      </tr>
      <tr id="sumrow" hidden><th></th><td id="sumresult" class="wrap"></td></tr>
    </table>
    <div id="error" class="error"></div>
    <label class="check"><input type="checkbox" id="dontshow" /> Don't show this dialog again</label>
    <div class="buttons">
      <span class="grow"></span>
      <button id="open" class="default">Open</button>
      <button id="folder">Open folder</button>
      <button id="cancel">Close</button>
    </div>
    <script src="common.js"></script>
    <script src="complete.js"></script>
  </body>
</html>
