[package]
name = "engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aes = "0.8.4"
base64 = "0.23.1"
bytes = "1.12.1"
cbc = "0.1.2"
futures-util = "0.3.34"
httpdate = "1.0.3"
md-5 = "0.11.0"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "stream"] }
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
tokio-util = "0.7.19"

[dev-dependencies]
testserver = { path = "../testserver" }
tokio = { version = "1.53.2", features = ["test-util"] }
