[package]
name = "manager"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = "0.4.45"
dirs = "7.0.0"
engine = { path = "../engine" }
interprocess = { version = "2.4.4", features = ["tokio"] }
pgp = "0.21.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "process"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
engine = { path = "../engine" }
testserver = { path = "../testserver" }
